name: Daily data refresh

on:
  schedule:
    - cron: '0 4 * * *'   # every day at 04:00 UTC (06:00–07:00 in Israel)
  workflow_dispatch:       # "Run workflow" button for a manual refresh
  push:                    # also run when the refresh code or its settings change
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull fresh data from Google
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node scripts/refresh.mjs
      - name: Save the new data
        run: |
          if git diff --quiet -- data.js; then
            echo "No change in data.js."
          else
            git config user.name "dashboard-refresh"
            git config user.email "dashboard-refresh@users.noreply.github.com"
            git add data.js
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
